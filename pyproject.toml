[project]
name = "retro"
version = "0.1.0"
description = "Headless VICE feedback loop for C64 and VIC-20 development"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pillow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retro"]
